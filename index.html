<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Chat — Claude Haiku</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0f;
      --surface: #111118;
      --surface2: #1a1a26;
      --border: #2a2a3d;
      --accent: #7c6fff;
      --accent2: #ff6fbc;
      --text: #e8e8f0;
      --muted: #6b6b88;
      --user-bg: #1e1e30;
      --ai-bg: #131320;
      --glow: rgba(124, 111, 255, 0.15);
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'IBM Plex Mono', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Animated background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 40% at 20% 10%, rgba(124,111,255,0.08) 0%, transparent 70%),
        radial-gradient(ellipse 40% 50% at 80% 80%, rgba(255,111,188,0.06) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* Header */
    header {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      background: rgba(10,10,15,0.9);
      backdrop-filter: blur(12px);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      color: #fff;
    }

    .logo-text {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 18px;
      letter-spacing: -0.5px;
    }

    .logo-text span {
      color: var(--accent);
    }

    .badge {
      font-size: 10px;
      padding: 3px 8px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 20px;
      color: var(--muted);
      letter-spacing: 0.05em;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .status-dot {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--muted);
    }

    .dot {
      width: 6px;
      height: 6px;
      background: #4ade80;
      border-radius: 50%;
      animation: pulse-dot 2s infinite;
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.8); }
    }

    /* Chat area */
    .chat-wrapper {
      flex: 1;
      position: relative;
      z-index: 1;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }

    #chat::-webkit-scrollbar { width: 4px; }
    #chat::-webkit-scrollbar-track { background: transparent; }
    #chat::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    /* Welcome screen */
    .welcome {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      gap: 16px;
      padding: 40px 20px;
      text-align: center;
      animation: fade-up 0.6s ease both;
    }

    .welcome-icon {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      margin-bottom: 8px;
      box-shadow: 0 0 40px var(--glow);
    }

    .welcome h2 {
      font-family: 'Syne', sans-serif;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .welcome p {
      font-size: 13px;
      color: var(--muted);
      max-width: 300px;
      line-height: 1.6;
    }

    .suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-top: 8px;
    }

    .suggestion-btn {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      padding: 8px 14px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      cursor: pointer;
      transition: all 0.2s;
    }

    .suggestion-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(124,111,255,0.08);
    }

    /* Message bubbles */
    .msg {
      display: flex;
      gap: 12px;
      max-width: 720px;
      width: 100%;
      margin: 0 auto;
      animation: fade-up 0.3s ease both;
    }

    @keyframes fade-up {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .msg.user { flex-direction: row-reverse; }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 600;
      font-family: 'Syne', sans-serif;
    }

    .avatar.user-av {
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: #fff;
    }

    .avatar.ai-av {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
      box-shadow: 0 0 20px var(--glow);
    }

    .bubble {
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 13.5px;
      line-height: 1.7;
      max-width: calc(100% - 56px);
      white-space: pre-wrap;
      word-break: break-word;
    }

    .msg.user .bubble {
      background: var(--user-bg);
      border: 1px solid #2a2a45;
      border-top-right-radius: 4px;
      color: var(--text);
    }

    .msg.ai .bubble {
      background: var(--ai-bg);
      border: 1px solid var(--border);
      border-top-left-radius: 4px;
      color: var(--text);
    }

    /* Typing indicator */
    .typing-indicator {
      display: flex;
      gap: 4px;
      padding: 4px 0;
    }

    .typing-indicator span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      animation: bounce 1.2s infinite;
    }

    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
      40% { transform: translateY(-6px); opacity: 1; }
    }

    /* Input area */
    .input-area {
      position: relative;
      z-index: 10;
      padding: 16px;
      border-top: 1px solid var(--border);
      background: rgba(10,10,15,0.95);
      backdrop-filter: blur(12px);
    }

    .input-box {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 10px 10px 16px;
      transition: border-color 0.2s, box-shadow 0.2s;
      max-width: 720px;
      margin: 0 auto;
    }

    .input-box:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(124,111,255,0.12);
    }

    #user-input {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      color: var(--text);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13.5px;
      resize: none;
      max-height: 120px;
      line-height: 1.6;
      padding: 2px 0;
    }

    #user-input::placeholder { color: var(--muted); }

    #user-input::-webkit-scrollbar { width: 3px; }
    #user-input::-webkit-scrollbar-thumb { background: var(--border); }

    .send-btn {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: opacity 0.2s, transform 0.15s;
    }

    .send-btn:hover:not(:disabled) { opacity: 0.85; transform: scale(1.05); }
    .send-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    .send-btn svg { width: 16px; height: 16px; fill: #fff; }

    .input-footer {
      display: flex;
      justify-content: center;
      margin-top: 8px;
      font-size: 10px;
      color: var(--muted);
      gap: 4px;
    }

    .input-footer span { color: var(--accent); }

    /* Clear btn */
    .clear-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--muted);
      cursor: pointer;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      padding: 4px 10px;
      transition: all 0.2s;
    }
    .clear-btn:hover { border-color: var(--accent2); color: var(--accent2); }

    /* Error toast */
    .error-toast {
      position: fixed;
      top: 80px;
      left: 50%;
      transform: translateX(-50%);
      background: #2d1a1a;
      border: 1px solid #7f1d1d;
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 12px;
      color: #fca5a5;
      z-index: 999;
      animation: fade-up 0.3s ease;
    }

    @media (max-width: 480px) {
      header { padding: 12px 16px; }
      .logo-text { font-size: 16px; }
      #chat { padding: 16px 12px; }
      .input-area { padding: 12px; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">AI</div>
    <div class="logo-text">Over<span>Chat</span></div>
    <div class="badge">Claude Haiku</div>
  </div>
  <div class="header-right">
    <div class="status-dot">
      <div class="dot"></div>
      <span>Online</span>
    </div>
    <button class="clear-btn" onclick="clearChat()">Hapus Chat</button>
  </div>
</header>

<div class="chat-wrapper">
  <div id="chat">
    <div class="welcome" id="welcome">
      <div class="welcome-icon">✦</div>
      <h2>Halo! Ada yang bisa dibantu?</h2>
      <p>Tanya apa saja — aku siap membantu kamu sekarang.</p>
      <div class="suggestions">
        <button class="suggestion-btn" onclick="fillSuggestion('Ceritakan tentang dirimu')">Ceritakan tentang dirimu</button>
        <button class="suggestion-btn" onclick="fillSuggestion('Buatkan puisi tentang hujan')">Buatkan puisi tentang hujan</button>
        <button class="suggestion-btn" onclick="fillSuggestion('Apa itu kecerdasan buatan?')">Apa itu AI?</button>
        <button class="suggestion-btn" onclick="fillSuggestion('Bantu aku debugging kode JavaScript')">Bantu debugging JS</button>
      </div>
    </div>
  </div>

  <div class="input-area">
    <div class="input-box">
      <textarea
        id="user-input"
        rows="1"
        placeholder="Ketik pesanmu di sini..."
        onkeydown="handleKey(event)"
        oninput="autoResize(this)"
      ></textarea>
      <button class="send-btn" id="send-btn" onclick="sendMessage()">
        <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/></svg>
      </button>
    </div>
    <div class="input-footer">
      Powered by <span>overchat.ai</span> &nbsp;·&nbsp; Model: <span>Claude Haiku 4.5</span>
    </div>
  </div>
</div>

<script>
  const API = "https://api.overchat.ai/v1/chat/completions";
  const STORAGE_KEY = "overchat_session";

  let session = loadSession();
  let isLoading = false;

  function loadSession() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch {}
    return {
      chatId: crypto.randomUUID(),
      deviceId: crypto.randomUUID(),
      messages: [],
    };
  }

  function saveSession() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(session));
    } catch {}
  }

  function clearChat() {
    session = {
      chatId: crypto.randomUUID(),
      deviceId: crypto.randomUUID(),
      messages: [],
    };
    saveSession();
    const chat = document.getElementById("chat");
    chat.innerHTML = `
      <div class="welcome" id="welcome">
        <div class="welcome-icon">✦</div>
        <h2>Halo! Ada yang bisa dibantu?</h2>
        <p>Tanya apa saja — aku siap membantu kamu sekarang.</p>
        <div class="suggestions">
          <button class="suggestion-btn" onclick="fillSuggestion('Ceritakan tentang dirimu')">Ceritakan tentang dirimu</button>
          <button class="suggestion-btn" onclick="fillSuggestion('Buatkan puisi tentang hujan')">Buatkan puisi tentang hujan</button>
          <button class="suggestion-btn" onclick="fillSuggestion('Apa itu kecerdasan buatan?')">Apa itu AI?</button>
          <button class="suggestion-btn" onclick="fillSuggestion('Bantu aku debugging kode JavaScript')">Bantu debugging JS</button>
        </div>
      </div>`;
  }

  function fillSuggestion(text) {
    const input = document.getElementById("user-input");
    input.value = text;
    autoResize(input);
    input.focus();
  }

  function autoResize(el) {
    el.style.height = "auto";
    el.style.height = Math.min(el.scrollHeight, 120) + "px";
  }

  function handleKey(e) {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  }

  function hideWelcome() {
    const w = document.getElementById("welcome");
    if (w) w.remove();
  }

  function appendMessage(role, content) {
    hideWelcome();
    const chat = document.getElementById("chat");
    const div = document.createElement("div");
    div.className = `msg ${role}`;

    const isAI = role === "ai";
    div.innerHTML = `
      <div class="avatar ${isAI ? "ai-av" : "user-av"}">${isAI ? "✦" : "U"}</div>
      <div class="bubble">${escapeHtml(content)}</div>
    `;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div.querySelector(".bubble");
  }

  function appendTyping() {
    hideWelcome();
    const chat = document.getElementById("chat");
    const div = document.createElement("div");
    div.className = "msg ai";
    div.id = "typing-msg";
    div.innerHTML = `
      <div class="avatar ai-av">✦</div>
      <div class="bubble">
        <div class="typing-indicator">
          <span></span><span></span><span></span>
        </div>
      </div>
    `;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  function escapeHtml(str) {
    return str
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function showError(msg) {
    const existing = document.querySelector(".error-toast");
    if (existing) existing.remove();
    const el = document.createElement("div");
    el.className = "error-toast";
    el.textContent = "⚠ " + msg;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 4000);
  }

  async function sendMessage() {
    if (isLoading) return;
    const input = document.getElementById("user-input");
    const text = input.value.trim();
    if (!text) return;

    input.value = "";
    autoResize(input);

    const btn = document.getElementById("send-btn");
    btn.disabled = true;
    isLoading = true;

    // Show user message
    appendMessage("user", text);

    // Show typing indicator
    const typingEl = appendTyping();

    const userMessage = {
      id: crypto.randomUUID(),
      role: "user",
      content: text,
    };

    const systemMessage = {
      id: crypto.randomUUID(),
      role: "system",
      content: "Ikuti bahasa user dan jawab dengan gaya natural, singkat, dan jelas.",
    };

    const body = {
      chatId: session.chatId,
      model: "claude-haiku-4-5-20251001",
      messages: [...session.messages, userMessage, systemMessage],
      personaId: "claude-haiku-4-5-landing",
      frequency_penalty: 0,
      max_tokens: 4000,
      presence_penalty: 0,
      stream: true,
      temperature: 0.5,
      top_p: 0.95,
    };

    const headers = {
      "sec-ch-ua-platform": `"Android"`,
      "x-device-uuid": session.deviceId,
      "sec-ch-ua": `"Google Chrome";v="147", "Not.A/Brand";v="8", "Chromium";v="147"`,
      "sec-ch-ua-mobile": "?1",
      "x-device-language": "id-ID",
      "x-device-platform": "web",
      "x-device-version": "1.0.44",
      "user-agent": "Mozilla/5.0 (Linux; Android 10; K) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/147.0.0.0 Mobile Safari/537.36",
      "accept": "*/*",
      "content-type": "application/json",
      "origin": "https://overchat.ai",
      "referer": "https://overchat.ai/",
      "accept-language": "id-ID,id;q=0.9",
    };

    try {
      const response = await fetch(API, {
        method: "POST",
        headers,
        body: JSON.stringify(body),
      });

      if (!response.ok) {
        throw new Error(`HTTP ${response.status}`);
      }

      // Remove typing indicator
      typingEl.remove();

      // Create AI bubble for streaming
      const bubble = appendMessage("ai", "");
      let answer = "";

      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";

      while (true) {
        const { value, done } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split("\n");
        buffer = lines.pop() || "";

        for (const rawLine of lines) {
          const line = rawLine.trim();
          if (!line.startsWith("data:")) continue;
          const data = line.slice(5).trim();
          if (!data || data === "[DONE]") continue;

          try {
            const json = JSON.parse(data);
            const content = json.choices?.[0]?.delta?.content;
            if (typeof content === "string") {
              answer += content;
              bubble.textContent = answer;
              document.getElementById("chat").scrollTop = document.getElementById("chat").scrollHeight;
            }
          } catch {}
        }
      }

      // Save to session
      const assistantMessage = {
        id: crypto.randomUUID(),
        role: "assistant",
        content: answer,
      };
      session.messages.push(userMessage);
      session.messages.push(assistantMessage);
      saveSession();

    } catch (err) {
      typingEl.remove();
      showError("Gagal menghubungi server. Coba lagi.");
      console.error(err);
    }

    btn.disabled = false;
    isLoading = false;
    input.focus();
  }
</script>
</body>
</html>
